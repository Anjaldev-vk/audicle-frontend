        Authenticated via X-Internal-Secret header, not JWT.
      tags:
      - internal
      responses:
        '200':
          description: No response body
components:
  schemas:
    AccountTypeEnum:
      enum:
      - individual
      - create_org
      - join_org
      type: string
      description: |-
        * `individual` - individual
        * `create_org` - create_org
        * `join_org` - join_org
    ChangeUserPassword:
      type: object
      properties:
        old_password:
          type: string
          writeOnly: true
        new_password:
          type: string
          writeOnly: true
        confirm_password:
          type: string
          writeOnly: true
      required:
      - confirm_password
      - new_password
      - old_password
    CookieRefresh:
      type: object
      properties:
        refresh:
          type: string
    CreateOrganisationInvite:
      type: object
      properties:
        email:
          type: string
          format: email
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          default: member
      required:
      - email
    GoogleLogin:
      type: object
      properties:
        token:
          type: string
      required:
      - token
    LoginUser:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    Organisation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        plan:
          $ref: '#/components/schemas/PlanEnum'
        logo_url:
          type: string
          format: uri
          nullable: true
          maxLength: 200
      required:
      - id
      - name
      - slug
    OrganisationCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        slug:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
      required:
      - name
      - slug
    PaginatedUserList:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            results:
              type: array
              items:
                $ref: '#/components/schemas/User'
            pagination:
              type: object
              properties:
                total:
                  type: integer
                page:
