openapi: 3.0.3
info:
  title: Audicle API
  version: 1.0.0 (v1)
  description: API documentation for Audicle backend
paths:
  /api/schema/:
    get:
      operationId: api_schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - ht
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
          - nn
          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/accounts/change-password/:
    post:
      operationId: api_v1_accounts_change_password_create
      tags:
      - Profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeUserPassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangeUserPassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangeUserPassword'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
          description: ''
  /api/v1/accounts/invite/{code}/:
    get:
      operationId: api_v1_accounts_invite_retrieve
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      tags:
      - Organisation
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  organisation:
                    type: string
                  email:
                    type: string
                  role:
                    type: string
          description: ''
  /api/v1/accounts/invite/{code}/accept/:
    post:
      operationId: api_v1_accounts_invite_accept_create
      description: |-
        POST /api/v1/accounts/invites/<code>/accept/
        Accepts an invite and creates a Membership.
        Invalidates workspace cache so new org appears immediately.
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/accounts/login/:
    post:
      operationId: api_v1_accounts_login_create
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginUser'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/accounts/login/google/:
    post:
      operationId: api_v1_accounts_login_google_create
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLogin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleLogin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleLogin'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/accounts/logout/:
    post:
      operationId: api_v1_accounts_logout_create
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CookieRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CookieRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CookieRefresh'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
          description: ''
  /api/v1/accounts/me/:
    get:
      operationId: api_v1_accounts_me_retrieve
      description: |-
        GET  /api/v1/accounts/me/  — Returns profile (cached 5 min)
        PATCH /api/v1/accounts/me/ — Updates profile + invalidates cache
      tags:
      - Profile
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: api_v1_accounts_me_partial_update
      description: |-
        GET  /api/v1/accounts/me/  — Returns profile (cached 5 min)
        PATCH /api/v1/accounts/me/ — Updates profile + invalidates cache
      tags:
      - Profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateUserProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateUserProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateUserProfile'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/accounts/mfa/disable/:
    post:
      operationId: api_v1_accounts_mfa_disable_create
      description: |-
        POST /api/v1/accounts/mfa/disable/

        Intentional disable from security settings.
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/accounts/mfa/enable/:
    post:
      operationId: api_v1_accounts_mfa_enable_create
      description: |-
        POST /api/v1/accounts/mfa/enable/

        Generates a TOTP secret and returns the otpauth:// URI.
        Does NOT activate MFA yet — user must call verify-setup/ to confirm.
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/accounts/mfa/recover/request/:
    post:
      operationId: api_v1_accounts_mfa_recover_request_create
      description: |-
        POST /api/v1/accounts/mfa/recover/request/

        User declares their device is lost. Sends a 6-digit OTP to registered email.
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/accounts/mfa/recover/verify/:
    post:
      operationId: api_v1_accounts_mfa_recover_verify_create
      description: |-
        POST /api/v1/accounts/mfa/recover/verify/

        Exchange mfa_token + email OTP for full JWT. Auto-disables MFA on success.
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/accounts/mfa/verify/:
    post:
      operationId: api_v1_accounts_mfa_verify_create
      description: |-
        POST /api/v1/accounts/mfa/verify/

        Primary path — exchange mfa_token + 6-digit app code for full JWT.
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/accounts/mfa/verify-setup/:
    post:
      operationId: api_v1_accounts_mfa_verify_setup_create
      description: |-
        POST /api/v1/accounts/mfa/verify-setup/

        Confirms the TOTP code from the authenticator app and activates MFA on success.
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/accounts/organisation/:
    get:
      operationId: api_v1_accounts_organisation_retrieve
      description: |-
        GET  /api/v1/accounts/organisation/ — Returns org details (cached 5 min)
        PATCH /api/v1/accounts/organisation/ — Updates org + invalidates cache
      tags:
      - Organisation
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organisation'
          description: ''
    patch:
      operationId: api_v1_accounts_organisation_partial_update
      description: |-
        GET  /api/v1/accounts/organisation/ — Returns org details (cached 5 min)
        PATCH /api/v1/accounts/organisation/ — Updates org + invalidates cache
      tags:
      - Organisation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateOrganisation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateOrganisation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateOrganisation'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organisation'
          description: ''
  /api/v1/accounts/organisation/invite/:
    post:
      operationId: api_v1_accounts_organisation_invite_create
      tags:
      - Organisation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganisationInvite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateOrganisationInvite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateOrganisationInvite'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  code:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
          description: ''
  /api/v1/accounts/organisation/members/:
    get:
      operationId: api_v1_accounts_organisation_members_list
      description: GET /api/v1/accounts/organisation/members/ — Returns members (cached
        5 min, paginated)
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Organisation
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserList'
          description: ''
  /api/v1/accounts/organisation/members/{user_id}/remove/:
    delete:
      operationId: api_v1_accounts_organisation_members_remove_destroy
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Organisation
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
          description: ''
  /api/v1/accounts/password-reset/confirm/:
    post:
      operationId: api_v1_accounts_password_reset_confirm_create
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordConfirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResetPasswordConfirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResetPasswordConfirm'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
          description: ''
  /api/v1/accounts/password-reset/request/:
    post:
      operationId: api_v1_accounts_password_reset_request_create
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestPasswordReset'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RequestPasswordReset'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RequestPasswordReset'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
          description: ''
  /api/v1/accounts/register/:
    post:
      operationId: api_v1_accounts_register_create
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterUser'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/accounts/token/refresh/:
    post:
      operationId: api_v1_accounts_token_refresh_create
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CookieRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CookieRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CookieRefresh'
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  access:
                    type: string
          description: ''
  /api/v1/accounts/workspaces/:
    get:
      operationId: api_v1_accounts_workspaces_retrieve
      description: GET /api/v1/accounts/workspaces/ — Returns all workspaces (cached
        5 min, paginated)
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/accounts/workspaces/create/:
    post:
      operationId: api_v1_accounts_workspaces_create_create
      description: |-
        POST /api/v1/accounts/workspaces/create/ — Creates a new org workspace
        Invalidates workspace cache so next GET returns fresh list.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganisationCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrganisationCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrganisationCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganisationCreate'
          description: ''
  /api/v1/action-items/:
    get:
      operationId: api_v1_action_items_retrieve
      description: GET /api/v1/action-items/ — cross-meeting, workspace scoped
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/action-items/{item_id}/:
    patch:
      operationId: api_v1_action_items_partial_update
      description: PATCH + DELETE /api/v1/action-items/<item_id>/
      parameters:
      - in: path
        name: item_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    delete:
      operationId: api_v1_action_items_destroy
      description: PATCH + DELETE /api/v1/action-items/<item_id>/
      parameters:
      - in: path
        name: item_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/analytics/activity/:
    get:
      operationId: api_v1_analytics_activity_retrieve
      description: |-
        GET /api/v1/analytics/activity/?period=30d
        All event types over time for charts.
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/analytics/meetings/:
    get:
      operationId: api_v1_analytics_meetings_retrieve
      description: |-
        GET /api/v1/analytics/meetings/?period=30d
        Meeting frequency chart data grouped by day.
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/analytics/overview/:
    get:
      operationId: api_v1_analytics_overview_retrieve
      description: |-
        GET /api/v1/analytics/overview/?period=30d
        Personal or org overview based on workspace context.
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/analytics/team/members/:
    get:
      operationId: api_v1_analytics_team_members_retrieve
      description: |-
        GET /api/v1/analytics/team/members/?period=30d
        Org admin only — per-member activity breakdown.
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/analytics/team/overview/:
    get:
      operationId: api_v1_analytics_team_overview_retrieve
      description: |-
        GET /api/v1/analytics/team/overview/?period=30d
        Org admin only — team-wide overview.
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/billing/cancel/:
    post:
      operationId: api_v1_billing_cancel_create
      description: |-
        POST /api/v1/billing/cancel/
        Cancels the current active subscription.
      tags:
      - Billing
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/billing/checkout/:
    post:
      operationId: api_v1_billing_checkout_create
      description: |-
        POST /api/v1/billing/checkout/
        Initializes a Razorpay subscription and returns the ID.
      tags:
      - Billing
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/billing/plan/:
    get:
      operationId: api_v1_billing_plan_retrieve
      description: |-
        GET /api/v1/billing/plan/
        Returns current plan, usage, and available upgrade options.
      tags:
      - Billing
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/billing/usage/:
    get:
      operationId: api_v1_billing_usage_retrieve
      description: |-
        GET /api/v1/billing/usage/
        Returns detailed usage metrics.
      tags:
      - Billing
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/billing/verify/:
    post:
      operationId: api_v1_billing_verify_create
      description: |-
        POST /api/v1/billing/verify/
        Verifies Razorpay payment signature after successful checkout.
      tags:
      - Billing
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/billing/webhook/:
    post:
      operationId: api_v1_billing_webhook_create
      description: |-
        POST /api/v1/billing/webhook/
        Handles Razorpay events (subscription.activated, subscription.cancelled, etc.)
      tags:
      - Billing
      responses:
        '200':
          description: No response body
  /api/v1/calendar/callback/:
    get:
      operationId: api_v1_calendar_callback_retrieve
      description: |-
        GET /api/v1/calendar/callback/

        Google redirects here after user grants calendar access.
        Exchanges the authorization code for access + refresh tokens.
        Saves tokens to GoogleCalendarToken model.
        Redirects user back to frontend dashboard.
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/v1/calendar/connect/:
    get:
      operationId: api_v1_calendar_connect_retrieve
      description: |-
        GET /api/v1/calendar/connect/

        Generates a Google OAuth URL and returns it to the frontend.
        Frontend redirects the user to this URL.
        After consent, Google redirects to /api/v1/calendar/callback/

        We encode user_id and workspace_id in the OAuth state parameter
        so we know which user to associate the token with on callback.
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/calendar/disconnect/:
    post:
      operationId: api_v1_calendar_disconnect_create
      description: |-
        POST /api/v1/calendar/disconnect/

        Revokes Google Calendar access and deletes the stored token.
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/calendar/status/:
    get:
      operationId: api_v1_calendar_status_retrieve
      description: |-
